.party-pick.on{ background:var(--panelHi); border-width:2px; }
.pick-dot{ width:14px; height:14px; border-radius:50%; flex:none; }
.pick-name{ font-family:'Oswald',sans-serif; font-size:13px; flex:1; }
.pick-vote{ font-size:12px; color:var(--inksoft); font-weight:600; }
.ex-preview{ margin-top:14px; border:1.5px solid var(--lineDk); background:var(--panel); border-radius:4px; padding:12px; }
.ex-title{ font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.5px; margin-bottom:8px; }
.ex-ideos{ display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; }
.ex-ideo{ display:flex; justify-content:space-between; font-size:11px; border-bottom:1px dashed var(--line); padding:2px 0; }
.ex-ideo span{ color:var(--inksoft); }

.btn-play{ width:100%; margin-top:20px; padding:16px; border:none; color:#fff; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:2px; cursor:pointer; border-radius:4px; box-shadow:0 3px 0 rgba(0,0,0,.25); }
.btn-play:disabled{ opacity:.45; cursor:not-allowed; }
.rules-toggle{ width:100%; margin-top:14px; background:none; border:none; color:var(--inksoft); font-family:'Oswald',sans-serif; letter-spacing:1px; font-size:12px; text-transform:uppercase; cursor:pointer; text-align:left; padding:6px 2px; }
.rules-box{ background:var(--panel); border-left:3px solid var(--ink); padding:10px 14px; }
.rules-box p{ font-size:12px; line-height:1.55; margin:7px 0; color:#40382b; }

/* topbar */
.topbar{ background:var(--ink); color:var(--paper2); padding:12px 16px 0; }
.tb-left{ display:inline-flex; align-items:center; gap:8px; }
.tb-dot{ width:13px; height:13px; border-radius:50%; box-shadow:0 0 0 2px var(--paper2); }
.tb-name{ font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:.5px; }
.tb-right{ float:right; }
.cp-chip{ display:inline-flex; align-items:baseline; gap:4px; background:var(--paper2); color:var(--ink); padding:4px 11px; border-radius:20px; }
.cp-num{ font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; }
.cp-lbl{ font-size:10px; letter-spacing:1px; }
.approvbar{ position:relative; height:20px; margin:11px -16px 0; background:#241f18; overflow:hidden; }
.approv-fill{ position:absolute; left:0; top:0; bottom:0; transition:width .4s ease; }
.approv-txt{ position:relative; z-index:2; font-size:10.5px; line-height:20px; padding-left:12px; letter-spacing:.6px; color:#fff; font-family:'Oswald',sans-serif; }

/* ideology in game — compacte, una sola fila */
.ideo-list{ display:flex; flex-direction:column; gap:5px; }
.ideo-list.compact .ideo-row{ display:flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:4px 7px; }
.ideo-name{ font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:.4px; width:104px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ideo-key{ color:var(--gold); font-size:11px; margin-right:3px; }
.ideo-num{ font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; width:20px; text-align:right; flex:none; }
.ideo-track{ flex:1; height:7px; background:#ddd0ad; border-radius:5px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.15); }
.ideo-fill{ height:100%; transition:width .2s ease; }
.ideo-list.compact .step{ width:24px; height:24px; }
.step{ width:30px; height:30px; flex:none; border:1.5px solid var(--lineDk); background:var(--panelHi); font-size:16px; line-height:1; cursor:pointer; border-radius:4px; color:var(--ink); font-family:'Oswald',sans-serif; }
.step:disabled{ opacity:.3; cursor:not-allowed; }

/* charts */
.chart-box{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:8px 8px 4px; }
.linechart{ display:block; }
.lc-grid{ stroke:var(--line); stroke-width:1; opacity:.7; }
.lc-ylab{ fill:var(--inksoft); font-family:'Oswald',sans-serif; font-size:8.5px; text-anchor:end; }
.lc-xlab{ fill:var(--inksoft); font-family:'Oswald',sans-serif; font-size:8.5px; }
.chart-cap{ font-size:10px; color:var(--inksoft); font-style:italic; margin:4px 2px 2px; }

/* relacions */
.rel-list{ display:flex; flex-direction:column; gap:4px; }
.rel-row{ display:flex; align-items:center; gap:8px; padding:4px 6px; }
.rel-name{ font-family:'Oswald',sans-serif; font-size:12px; width:86px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rel-track{ flex:1; height:8px; background:#ddd0ad; border-radius:5px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.15); }
.rel-fill{ height:100%; transition:width .4s ease; }
.rel-tag{ font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:.5px; width:52px; text-align:right; flex:none; }

/* historial d'eleccions */
.hist-list{ display:flex; flex-direction:column; gap:2px; margin-top:8px; }
.hist-row{ display:flex; align-items:center; gap:8px; padding:4px 6px; font-size:12px; border-bottom:1px dashed var(--line); }
.hist-turn{ font-family:'Oswald',sans-serif; font-weight:600; color:var(--inksoft); width:30px; flex:none; }
.hist-win{ font-family:'Oswald',sans-serif; flex:1; }
.hist-me{ font-family:'Oswald',sans-serif; font-size:11px; }

/* turn summary */
.ts-cards{ display:flex; gap:8px; margin:6px 0 10px; }
.ts-card{ flex:1; background:var(--panelHi); border:1px solid var(--line); border-radius:5px; padding:7px 8px; text-align:center; display:flex; flex-direction:column; gap:1px; }
.ts-lbl{ font-family:'Oswald',sans-serif; font-size:9px; letter-spacing:.5px; text-transform:uppercase; color:var(--inksoft); }
.ts-val{ font-family:var(--display); font-weight:700; font-size:19px; }
.ts-delta{ font-family:'Oswald',sans-serif; font-size:9.5px; color:var(--inksoft); }
.ts-delta.u{ color:#3f7a4f; } .ts-delta.d{ color:#b23a2e; }
.ts-listhead{ display:flex; align-items:center; gap:9px; padding:2px 8px; font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--inksoft); border-bottom:1.5px solid var(--ink); }
.ts-listhead .ts-name{ flex:1; }
.ts-list{ display:flex; flex-direction:column; gap:1px; margin:3px 0 8px; }
.ts-row{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:3px; font-size:16px; border-bottom:1px dashed var(--line); }
.ts-row.me{ background:var(--panelHi); box-shadow:inset 0 0 0 1.5px var(--lineDk); }
.ts-name{ font-family:'Oswald',sans-serif; font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ts-seat{ font-family:var(--display); font-weight:700; font-size:19px; width:44px; text-align:right; }
.ts-vote{ font-family:'Oswald',sans-serif; font-size:15px; width:60px; text-align:right; }

.congress-box{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px; }
.congress-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; }
.btn-congress{ width:100%; margin:9px 0 6px; padding:12px; background:var(--panelHi); border:2px solid var(--lineDk); font-family:'Oswald',sans-serif; letter-spacing:1.5px; font-size:13px; text-transform:uppercase; cursor:pointer; border-radius:4px; }
.btn-congress:disabled{ opacity:.4; cursor:not-allowed; }

/* poll & seats */
.poll{ display:flex; flex-direction:column; gap:4px; }
.poll-row, .seat-row{ display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:3px; }
.poll-row.me, .seat-row.me{ background:var(--panelHi); box-shadow:inset 0 0 0 1.5px var(--lineDk); }
.pdot{ width:12px; height:12px; border-radius:50%; flex:none; }
.pdot.sm{ width:9px; height:9px; }
.pname{ font-family:'Oswald',sans-serif; font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pbar{ flex:1; height:11px; background:#ddd0ad; border-radius:6px; overflow:hidden; }
.pbar-fill{ height:100%; transition:width .4s ease; }
.pval{ font-family:'Oswald',sans-serif; font-size:12.5px; width:46px; text-align:right; flex:none; }
.pdelta{ font-size:10px; width:32px; text-align:right; color:var(--inksoft); font-family:'Oswald',sans-serif; flex:none; }
.pdelta.u{ color:#3f7a4f; } .pdelta.d{ color:#b23a2e; }
.pdelta.seatd{ width:26px; }
.pseat{ font-family:'Oswald',sans-serif; font-size:13px; font-weight:600; width:48px; text-align:right; flex:none; }
.pseat i{ font-style:normal; font-weight:400; font-size:9px; color:var(--inksoft); margin-left:2px; }
.seat-n{ margin-left:auto; font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; }
.seat-list{ display:flex; flex-direction:column; gap:2px; margin-top:10px; }

.seatbar-wrap{ margin:4px 0 6px; }
.seatbar{ position:relative; display:flex; height:26px; border:1.5px solid var(--ink); border-radius:4px; overflow:hidden; background:#ddd0ad; }
.seatbar-seg{ height:100%; } 
.major-line{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
.major-line:after{ content:"68"; position:absolute; top:-13px; left:-6px; font-size:9px; font-family:'Oswald',sans-serif; }
.seatbar-cap{ font-size:10.5px; color:var(--inksoft); text-align:right; margin-top:4px; font-style:italic; }

.prov-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
.prov-grid.ov{ margin-top:10px; }
.prov{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:8px 9px; }
.prov-h{ font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:.5px; border-bottom:1.5px solid var(--ink); padding-bottom:4px; margin-bottom:5px; }
.prov-h span{ color:var(--inksoft); font-weight:400; }
.prov-row{ display:flex; align-items:center; gap:6px; padding:1.5px 0; font-size:11.5px; }
.prov-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prov-n{ font-family:'Oswald',sans-serif; font-weight:600; }

/* país */
.gov-banner{ display:flex; align-items:center; gap:14px; background:var(--panelHi); border:2px solid var(--line); border-radius:6px; padding:14px 16px; }
.gov-banner.none{ border-style:dashed; }
.gov-dot{ width:26px; height:26px; border-radius:50%; flex:none; box-shadow:0 0 0 3px var(--paper2), 0 0 0 4px var(--line); }
.gov-info{ display:flex; flex-direction:column; flex:1; min-width:0; }
.gov-lbl{ font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--inksoft); }
.gov-name{ font-family:var(--display); font-weight:700; font-size:24px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gov-seats{ font-family:var(--display); font-weight:700; font-size:30px; flex:none; }
.gov-seats i{ display:block; font-style:normal; font-family:'Oswald',sans-serif; font-size:10px; font-weight:400; color:var(--inksoft); text-align:right; letter-spacing:.5px; }
.pais-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* gabinet */
.cabinet{ margin-top:10px; }
.cab-dots{ display:flex; gap:6px; flex-wrap:wrap; }
.cab-dot{ width:20px; height:20px; border-radius:50%; border:2px solid; flex:none; box-shadow:inset 0 -2px 3px rgba(0,0,0,.15); }
.cab-dot.me{ box-shadow:0 0 0 2px var(--ink), inset 0 -2px 3px rgba(0,0,0,.15); }
.cab-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:9px; }
.cab-leg{ display:flex; align-items:center; gap:5px; font-family:'Oswald',sans-serif; font-size:11.5px; }

/* impostos */
.tax-box{ background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:12px 14px; }
.tax-head, .tax-foot{ display:flex; justify-content:space-between; align-items:center; font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:.5px; }
.tax-foot{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
.tax-val{ font-family:var(--display); font-size:22px; }
.tax-foot b{ font-family:var(--display); font-size:20px; }
.tax-range{ width:100%; margin:10px 0 2px; accent-color:var(--gold); }

/* crisis */
.crisis-box{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; background:#f7ecd6; border-left:4px solid var(--red); border-radius:0 5px 5px 0; padding:10px 13px; margin-bottom:10px; }
.crisis-box.ok{ border-left-color:var(--green); background:#eef2e2; }
.crisis-h{ font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:.5px; color:var(--red); }
.crisis-item{ font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; }

/* targetes d'indicador clicables */
.pais-card{ background:var(--panelHi); border:1px solid var(--line); border-radius:6px; padding:11px 12px; }
.pais-card.clickable{ cursor:pointer; transition:box-shadow .15s, transform .1s; }
.pais-card.clickable:hover{ box-shadow:0 2px 8px rgba(60,48,28,.16); }
.pais-card.open{ box-shadow:inset 0 0 0 1.5px var(--lineDk); }
.pais-label{ display:flex; justify-content:space-between; align-items:center; font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--inksoft); }
.pais-caret{ color:var(--lineDk); font-size:11px; }
.pais-val{ font-family:var(--display); font-weight:700; font-size:30px; line-height:1.1; margin:2px 0 4px; }
.pais-suf{ font-size:15px; margin-left:1px; }
.pais-meta{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.sev-tag{ font-family:'Oswald',sans-serif; font-size:9.5px; letter-spacing:.6px; text-transform:uppercase; color:#fff; padding:2px 7px; border-radius:10px; }
.pais-delta{ font-family:'Oswald',sans-serif; font-size:12px; }
.ind-charthead{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--inksoft); margin-bottom:4px; }

/* variants compactes */
.crisis-box.compact{ padding:7px 11px; gap:6px 10px; margin-bottom:8px; }
.pais-grid.compact{ gap:7px; }
.pais-card.sm{ padding:8px 10px; }
.pais-card.sm .pais-label{ font-size:10.5px; }
.pais-row{ display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin:1px 0 4px; }
.pais-val.sm{ font-size:22px; margin:0; }
.pais-card.sm .pais-suf{ font-size:12px; }
.pais-card.sm .sev-tag{ display:inline-block; }
.tax-box.compact{ padding:10px 12px; }
.tax-line{ display:flex; align-items:center; gap:10px; font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:.4px; }
.tax-line .tax-val{ font-family:var(--display); font-size:20px; }
.tax-line .tax-inc{ margin-left:auto; font-size:12px; color:var(--inksoft); }
.tax-line .tax-inc b{ font-family:var(--display); font-size:17px; margin-left:3px; }
.tax-box.compact .tax-range{ margin:8px 0 4px; }

/* oferta i resultat de gabinet a la investidura */
.cab-offer{ font-size:12.5px; line-height:1.5; text-align:center; background:#f3ecd6; border:1px solid var(--line); border-radius:5px; padding:8px 10px; margin:4px 0 10px; }
.cab-offer.has{ border-color:var(--gold); background:#f6efd8; }
.cab-offer-dots{ display:inline-flex; gap:3px; vertical-align:middle; margin:0 3px; }
.cab-offer-dots .cab-dot{ width:14px; height:14px; }
.cab-result{ background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin:8px 0; }
.cab-result-h{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--inksoft); margin-bottom:8px; text-align:center; }
.cab-gain{ margin-top:9px; text-align:center; font-family:'Oswald',sans-serif; font-size:13px; color:var(--green); background:#eef2e2; border-radius:4px; padding:6px; }

/* conselleries i pressupost */
.budget-summary{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; background:var(--panelHi); border:1px solid var(--line); border-radius:5px; padding:9px 12px; font-family:'Oswald',sans-serif; font-size:12px; }
.budget-summary b{ font-family:var(--display); font-size:16px; }
.budget-summary i{ font-style:normal; font-size:10px; color:var(--inksoft); }
.cons-list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.cons-row{ background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:9px 11px; }
.cons-row.changed{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
.cons-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
.cons-name{ font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:.4px; }
.cons-desc{ font-size:10.5px; color:var(--inksoft); font-style:italic; }
.cons-ctrl{ display:flex; align-items:center; gap:9px; }
.cons-bar{ flex:1; height:12px; background:#ddd0ad; border-radius:6px; overflow:hidden; position:relative; box-shadow:inset 0 1px 2px rgba(0,0,0,.15); }
.cons-fill{ position:absolute; top:0; left:0; height:100%; background:var(--gold); }
.cons-ghost{ position:absolute; top:0; left:0; height:100%; background:repeating-linear-gradient(45deg, rgba(178,58,46,.55), rgba(178,58,46,.55) 5px, rgba(178,58,46,.25) 5px, rgba(178,58,46,.25) 10px); }
.cons-num{ font-family:var(--display); font-weight:700; font-size:16px; width:52px; text-align:right; }
.cons-num i{ font-style:normal; font-family:'Oswald',sans-serif; font-size:9px; color:var(--inksoft); margin-left:2px; }
.cons-actions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.law-btn{ flex:1; min-width:130px; padding:8px; border:1.5px solid var(--lineDk); background:var(--panelHi); border-radius:4px; cursor:pointer; font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:.4px; color:var(--ink); }
.law-btn b{ color:var(--gold); }
.law-btn.decret{ border-color:var(--gold); }
.law-btn:disabled{ opacity:.4; cursor:not-allowed; }
.cons-cancel{ padding:8px 12px; border:1px solid var(--line); background:transparent; border-radius:4px; cursor:pointer; font-family:'Oswald',sans-serif; font-size:11.5px; color:var(--inksoft); }

/* finestra de llei */
.law-change{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; background:#f3ecd6; border:1px solid var(--line); border-radius:5px; padding:9px 12px; margin:8px 0 4px; }
.law-chip{ font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; background:var(--ink); color:var(--paper2); padding:3px 9px; border-radius:10px; letter-spacing:.4px; }
.law-arrow{ font-family:var(--display); font-size:20px; }
.law-eff{ font-size:11px; color:var(--inksoft); font-style:italic; width:100%; text-align:center; }

/* debats — configuració */
.debate-picker{ margin-top:8px; }
.debate-parts{ display:flex; flex-direction:column; gap:5px; }
.debate-part{ display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--panel); border:1.5px solid var(--line); border-radius:5px; cursor:pointer; text-align:left; }
.debate-part.on{ background:var(--panelHi); box-shadow:inset 0 0 0 1px currentColor; }
.dp-name{ font-family:'Oswald',sans-serif; font-size:13px; flex:1; }
.dp-prob{ font-family:'Oswald',sans-serif; font-size:10.5px; color:var(--inksoft); }
.debate-actions{ display:flex; gap:6px; margin-top:8px; }

/* debats — finestra */
.debate-sheet{ max-width:560px; position:relative; }
.deb-board{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
.deb-score{ flex:1; min-width:88px; background:var(--panelHi); border:1px solid var(--line); border-top:3px solid; border-radius:5px; padding:7px 8px; display:flex; flex-direction:column; align-items:center; gap:1px; position:relative; }
.deb-score.me{ box-shadow:inset 0 0 0 1.5px var(--lineDk); }
.deb-name{ font-family:'Oswald',sans-serif; font-size:11px; font-weight:600; text-align:center; line-height:1.1; }
.deb-pts{ font-family:var(--display); font-weight:700; font-size:24px; }
.deb-pips{ display:flex; gap:3px; }
.deb-pip{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--lineDk); background:transparent; }
.deb-badge{ font-size:9px; font-family:'Oswald',sans-serif; color:var(--accent2, #5b7fff); }
.deb-plays{ display:flex; flex-direction:column; gap:3px; background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:7px 9px; margin-bottom:10px; max-height:150px; overflow-y:auto; }
.deb-play{ display:flex; align-items:center; gap:7px; font-size:12px; }
.deb-play-ic{ font-size:15px; }
.deb-play-tx{ font-family:'Oswald',sans-serif; }
.deb-hand{ display:flex; gap:8px; justify-content:center; }
.deb-card{ flex:1; max-width:150px; background:var(--panelHi); border:1.5px solid var(--lineDk); border-radius:8px; padding:12px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; transition:transform .1s, box-shadow .15s; }
.deb-card:hover:not(:disabled){ transform:translateY(-3px); box-shadow:0 5px 14px rgba(60,48,28,.22); }
.deb-card:disabled{ opacity:.35; cursor:not-allowed; }
.dc-ic{ font-size:28px; line-height:1; }
.dc-name{ font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; text-align:center; }
.dc-eff{ font-size:10px; color:var(--inksoft); text-align:center; }
.deb-targets{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.deb-tgt{ display:flex; align-items:center; gap:6px; padding:7px 11px; background:var(--panelHi); border:1.5px solid; border-radius:5px; cursor:pointer; font-family:'Oswald',sans-serif; font-size:12px; }
.deb-roundmsg{ text-align:center; font-family:var(--display); font-size:18px; margin:8px 0; }
.deb-final{ text-align:center; font-family:var(--display); font-weight:700; font-size:22px; margin:6px 0 10px; }
.deb-vc{ display:flex; flex-direction:column; gap:3px; margin-bottom:10px; }
.deb-vc-row{ display:flex; align-items:center; gap:8px; padding:5px 8px; border-bottom:1px dashed var(--line); }
.deb-vc-name{ font-family:'Oswald',sans-serif; font-size:13px; flex:1; }
.deb-vc-chg{ font-family:var(--display); font-weight:700; font-size:16px; }
.deb-popup-wrap{ position:absolute; inset:0; background:rgba(44,38,29,.55); display:flex; align-items:center; justify-content:center; border-radius:inherit; z-index:5; animation:fade .2s ease; }
.deb-popup{ width:78%; max-width:340px; background:var(--paper2); border:2px solid var(--lineDk); border-radius:12px; padding:20px 18px; text-align:center; box-shadow:0 12px 34px rgba(0,0,0,.4); animation:pop .35s cubic-bezier(.2,1.3,.4,1) both; }
.deb-popup.atk{ border-color:var(--red); }
.deb-popup.good{ border-color:var(--green); }
.deb-popup.bad{ border-color:var(--red); }
.dpop-ic{ font-size:44px; line-height:1; }
.dpop-h{ font-family:var(--display); font-weight:700; font-size:22px; margin:6px 0 4px; }
.dpop-b{ font-size:12.5px; color:var(--inksoft); line-height:1.5; margin-bottom:8px; }
.dpop-dmg{ font-family:var(--display); font-weight:700; font-size:26px; color:var(--red); margin-bottom:12px; }
.deb-popup .ov-btn{ margin-top:0; }
.palmares{ display:flex; gap:10px; }
.palm{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px; display:flex; flex-direction:column; align-items:center; }
.palm span{ font-size:11px; color:var(--inksoft); font-family:'Oswald',sans-serif; letter-spacing:.5px; }
.palm b{ font-family:'Oswald',sans-serif; font-size:26px; }

/* turnbar + tabbar */
.turnbar{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--paper2); border-top:2px solid var(--ink); }
.turn-info{ display:flex; flex-direction:column; line-height:1.2; }
.turn-n{ font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; letter-spacing:1px; }
.turn-el{ font-size:10.5px; color:var(--inksoft); }
.btn-turn{ margin-left:auto; padding:13px 22px; border:none; color:#fff; font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; letter-spacing:1.5px; cursor:pointer; border-radius:5px; box-shadow:0 3px 0 rgba(0,0,0,.28); }
.btn-turn:disabled{ opacity:.5; }
.tabbar{ display:flex; background:var(--ink); }
.tab{ flex:1; padding:13px 0; background:none; border:none; border-top:3px solid transparent; color:#b9ac93; font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; }
.tab.on{ color:var(--paper2); background:#241f18; }

/* overlays */
.overlay{ position:absolute; inset:0; background:rgba(30,25,18,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:40; animation:fade .25s ease; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet{ width:100%; max-height:calc(100% - 20px); overflow-y:auto; background:var(--paper2); border:1.5px solid var(--ink); border-radius:8px; padding:18px; box-shadow:0 14px 34px rgba(0,0,0,.4), inset 0 0 0 5px var(--paper2), inset 0 0 0 6px var(--line); }
.center-sheet{ text-align:center; }
.ov-kicker{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:2.5px; text-align:center; color:var(--inksoft); }
.ov-title{ font-family:var(--display); font-weight:700; font-size:30px; text-align:center; line-height:1.05; margin:2px 0 4px; }
.ov-sub{ text-align:center; font-size:12px; color:var(--inksoft); font-style:italic; margin-bottom:12px; }
.result-head{ border:2px solid; border-radius:5px; padding:11px; margin:12px 0; background:var(--panelHi); }
.rh-line{ display:flex; justify-content:space-between; padding:3px 0; font-size:13.5px; }
.rh-line b{ font-family:'Oswald',sans-serif; }
.rh-verdict{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); text-align:center; font-size:13px; font-weight:600; }
.rh-verdict.win{ color:var(--green); }
.ov-btn{ width:100%; margin-top:10px; padding:12px; background:var(--panelHi); border:1.5px solid var(--lineDk); font-family:'Oswald',sans-serif; letter-spacing:1px; font-size:13px; text-transform:uppercase; cursor:pointer; border-radius:5px; color:var(--ink); }
.ov-btn.primary{ color:#fff; border:none; box-shadow:0 3px 0 rgba(0,0,0,.25); }

/* investiture */
.vote-btns{ display:flex; gap:8px; margin:12px 0 6px; }
.vb{ flex:1; padding:14px 0; border:2px solid; font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:1px; font-size:14px; cursor:pointer; border-radius:5px; background:var(--panelHi); }
.vb.si{ border-color:#3f7a4f; color:#3f7a4f; } .vb.no{ border-color:#b23a2e; color:#b23a2e; } .vb.abs{ border-color:var(--gold); color:var(--gold); font-size:11px; }
.vote-tally{ display:flex; height:30px; border:1.5px solid var(--ink); border-radius:4px; overflow:hidden; margin:8px 0; }
.tally-seg{ display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.5px; min-width:0; }
.tally-seg.si{ background:#3f7a4f; } .tally-seg.no{ background:#b23a2e; } .tally-seg.abs{ background:#b09a5f; }
.vote-list{ display:flex; flex-direction:column; gap:2px; margin:6px 0; }
.vote-row{ display:flex; align-items:center; gap:7px; padding:4px 6px; border-radius:3px; font-size:12.5px; }
.vote-row.me{ background:var(--panelHi); box-shadow:inset 0 0 0 1.5px var(--lineDk); }
.vname{ flex:1; font-family:'Oswald',sans-serif; }
.vseats{ color:var(--inksoft); font-size:11px; width:28px; text-align:right; }
.vvote{ width:42px; text-align:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; padding:2px 0; border-radius:3px; }
.vvote.si{ color:#3f7a4f; } .vvote.no{ color:#b23a2e; } .vvote.abs{ color:var(--gold); }
.inv-verdict{ text-align:center; padding:10px; margin:8px 0; border-radius:5px; font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:.5px; }
.inv-verdict.ok{ background:#e5eede; color:#2f5a3b; } .inv-verdict.ko{ background:#f0dcd8; color:#8f2a20; }

/* congress + gameover */
.congress-verdict{ font-family:var(--display); font-weight:700; font-size:34px; letter-spacing:2px; margin:8px 0; }
.congress-verdict.ok{ color:var(--green); } .congress-verdict.ko{ color:var(--red); }
.gameover-title{ font-family:var(--display); font-weight:700; font-size:38px; letter-spacing:3px; color:var(--red); margin:4px 0 10px; }
.final-stats{ display:flex; justify-content:center; gap:18px; margin:14px 0; }
.final-stats div{ display:flex; flex-direction:column; }
.final-stats b{ font-family:var(--display); font-size:26px; }
.final-stats span{ font-size:10px; color:var(--inksoft); letter-spacing:.5px; text-transform:uppercase; }

/* toast */
.toast{ position:absolute; left:14px; right:14px; bottom:128px; background:var(--ink); color:var(--paper2); padding:11px 14px; border-radius:6px; font-size:12.5px; text-align:center; z-index:30; box-shadow:0 6px 16px rgba(0,0,0,.35); animation:fade .25s ease; }

/* recompte electoral */
.count-pct{ text-align:center; font-family:var(--display); font-weight:700; font-size:22px; letter-spacing:1px; color:var(--red); margin:2px 0 10px; animation:pulse 1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.55} }
.count-lead{ text-align:center; font-size:13px; margin:10px 0 6px; }
.count-lead b{ font-family:'Oswald',sans-serif; }
.reveal-pop{ animation:pop .45s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes pop{ 0%{ transform:scale(.8); opacity:0 } 100%{ transform:scale(1); opacity:1 } }
.seatbar-seg{ transition:width .12s linear; }
.seatchg{ font-family:'Oswald',sans-serif; font-size:11px; font-weight:600; width:34px; text-align:right; flex:none; color:var(--inksoft); }
.seatchg.u{ color:#3f7a4f; } .seatchg.d{ color:#b23a2e; }
.seat-n.counting{ color:var(--red); font-variant-numeric:tabular-nums; min-width:38px; text-align:right; }

/* investidura: voltes */
.round-tag{ text-align:center; font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:1px; text-transform:uppercase; background:#efe6cd; border:1px solid var(--line); border-radius:4px; padding:6px; margin:10px 0 8px; }
.round-tag.r2{ background:#efe0cf; border-color:var(--gold); color:#8a5f1e; }
.round-note{ font-size:11.5px; line-height:1.5; color:#6b5a3d; background:#f3ecd6; border-left:3px solid var(--gold); padding:7px 10px; border-radius:0 4px 4px 0; margin:8px 0; }
`;


const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<App />);
</script>
</body>
</html>
